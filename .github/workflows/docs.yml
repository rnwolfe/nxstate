name: docs

on:
  pull_request:
    paths: ['docs-site/**', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs-site/**', '.github/workflows/docs.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: docs-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Starlight `lastUpdated` git dates are correct
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec astro check     # frontmatter/slug/type validation
      - run: pnpm build                # static build → dist/ + llms*.txt
      - run: pnpm dlx lychee 'dist/**/*.html' --no-progress || true
