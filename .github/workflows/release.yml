name: Release

# Tag a release to trigger: `git tag -s vX.Y.Z && git push --tags`
on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # create the GitHub Release
  id-token: write       # PyPI Trusted Publishing (OIDC) + build provenance
  attestations: write   # SLSA build provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi    # configure a PyPI Trusted Publisher for this repo+environment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build sdist + wheel
        run: uv build
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish
