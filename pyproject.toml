[project]
name = "nxstate"
version = "0.2.0"
description = "Agent-friendly, read-only Cisco Nexus (NX-OS) state-gathering CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Wolfe" }]
keywords = ["cisco", "nexus", "nx-os", "cli", "network-automation", "read-only", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "click>=8.1",
    "scrapli>=2024.1.30",   # SSH transport, core cisco_nxos platform
    "ntc-templates>=4.0",   # TextFSM parser fallback
    "textfsm>=1.1",
    "keyring>=24",          # OS keyring credential storage
    "pyyaml>=6",            # inventory file parsing
]

[project.urls]
Homepage = "https://github.com/rnwolfe/nxstate"
Repository = "https://github.com/rnwolfe/nxstate"
Issues = "https://github.com/rnwolfe/nxstate/issues"
Changelog = "https://github.com/rnwolfe/nxstate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
genie = ["pyats[library]>=24"]  # heavy; enables Genie's ~293 NX-OS parsers

[project.scripts]
nxstate = "nxstate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nxstate"]

[tool.hatch.build.targets.sdist]
only-include = ["src/nxstate", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B904"]  # long click help; structured errors intentionally translate causes
