[project]
name = "nxstate"
version = "0.0.1"
description = "Agent-friendly, read-only Cisco Nexus (NX-OS) state-gathering CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["cisco", "nexus", "nx-os", "cli", "network-automation", "read-only", "agent"]
dependencies = [
    "click>=8.1",
    "scrapli>=2024.1.30",   # SSH transport, core cisco_nxos platform
    "ntc-templates>=4.0",   # TextFSM parser fallback
    "textfsm>=1.1",
    "keyring>=24",          # OS keyring credential storage
    "pyyaml>=6",            # inventory file parsing
]

[project.optional-dependencies]
dev = ["pytest>=8"]
genie = ["pyats[library]>=24"]  # heavy; enables Genie's ~293 NX-OS parsers

[project.scripts]
nxstate = "nxstate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nxstate"]
